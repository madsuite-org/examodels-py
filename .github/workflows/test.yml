name: test

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"          # weekly, to catch drift in the backend

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # juliapkg downloads its own Julia and resolves the backend into the
      # environment; both are worth caching, since together they are ~300 MB.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.julia
            .venv/julia_env
          key: julia-${{ runner.os }}-${{ hashFiles('src/examodels/juliapkg.json') }}

      - run: pip install -e ".[test]"

      - name: which backend is under test
        run: python -c "from examodels import _bridge as b; print(b.version, b.seval('pathof(ExaModels)'))"

      - run: pytest -q -m "not slow"

  examples:
    # A broken example shipped once because nothing ran them.
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.julia
            .venv/julia_env
          key: julia-examples-${{ hashFiles('src/examodels/juliapkg.json') }}
      - run: pip install -e ".[test]"
      - run: pytest tests/test_examples.py -q

  interface:
    # A fast gate on the thing most likely to break: the backend's exported
    # interface. Runs on its own so a failure here is unambiguous.
    name: backend interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.julia
            .venv/julia_env
          key: julia-interface-${{ hashFiles('src/examodels/juliapkg.json') }}
      - run: pip install -e ".[test]"
      - run: pytest tests/test_parity.py tests/test_dependencies.py -q -s

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests examples
