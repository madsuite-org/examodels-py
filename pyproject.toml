[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "examodels"
version = "0.1.0"
description = "Python interface to ExaModels.jl — SIMD-parallel algebraic modeling and AD for nonlinear programs on CPUs and GPUs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["juliacall>=0.9.20", "numpy>=1.23"]

[project.optional-dependencies]
test = ["pytest>=7"]
# Only for sharing device memory with CuPy; imported lazily, never on the CPU path.
cuda = ["cupy-cuda12x>=13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
examodels = ["juliapkg.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
