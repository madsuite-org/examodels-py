[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "examodels"
version = "0.1.0"
description = "Python interface to ExaModels.jl — SIMD-parallel algebraic modeling and AD for nonlinear programs on CPUs and GPUs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["juliacall>=0.9.20", "numpy>=1.23"]

[project.scripts]
examodels = "examodels.daemon:main"

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4", "tomli>=2; python_version < '3.11'"]
lint = ["ruff==0.16.2"]
# Read the Docs installs `.[docs]`; without this the build cannot start.
docs = ["sphinx>=7", "myst-parser>=2", "sphinx-rtd-theme>=3"]
# Only for sharing device memory with CuPy; imported lazily, never on the CPU path.
cuda = ["cupy-cuda12x>=13"]
# The cache-hit half of Core(cache=...): loading a compiled entry (cnlpmodels)
# and solving it without Julia (cyipopt). Imported lazily, only on a hit.
# cnlpmodels is unreleased, so the extra carries a direct reference; PyPI
# rejects those, so publishing examodels means publishing cnlpmodels FIRST
# and flattening this to `cnlpmodels>=0.1`.
cache = ["cnlpmodels @ git+https://github.com/madsuite-org/cnlpmodels-py",
         "cyipopt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
examodels = ["juliapkg.json"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Pinned explicitly: the default set changes between releases, and CI should not
# depend on which one the runner happens to install.
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = [
    "E741",   # `l` reads fine as a loop index over lines
    "C408",   # dict(...) reads better than a brace literal for keyword-shaped data
]

[tool.ruff.lint.per-file-ignores]
# These files embed Julia source in long string literals, which cannot be wrapped
# without making the Julia unreadable.
"src/examodels/_bridge.py" = ["E501"]
# The examples and a few tests must extend sys.path before importing a sibling.
# E402: a sibling import needs sys.path extended first.
# B023: a lambda in a loop body is traced immediately, before the next iteration
#       rebinds anything, so late binding cannot bite here.
# B018: a bare `x[9]` inside pytest.raises is the thing being tested.
"tests/*" = ["E402", "B023", "B018"]
"examples/*" = ["E402", "B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
